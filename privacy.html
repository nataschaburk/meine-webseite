.privacy-window {
    position: fixed;

    left: 50%;
    transform: translateX(-50%);

    top: 30vh;
    bottom: 8vh;

    width: 925px;

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: thin;

    font-family: "Barlow", sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.3;

    color: #000;

    padding-right: 18px;
}
