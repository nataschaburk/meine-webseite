<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Natascha Burk</title>

    <style>

        /* =========================================
           GRUNDEINSTELLUNGEN
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: white;
            overflow-x: hidden;
        }


        /* =========================================
           STARTBEREICH
        ========================================= */

        .intro {
            width: 100%;
            height: 100vh;
        }


        /* =========================================
           LOGO
        ========================================= */

        #logo {
            position: fixed;

            left: 50%;
            top: 50vh;

            width: 52%;
            max-width: 820px;
            height: auto;

            transform: translate(-50%, -50%);

            transform-origin: center center;

            z-index: 100;

            will-change: transform, top;
        }


        /* =========================================
           NAVIGATION LINKS
        ========================================= */

        .navigation {
            position: fixed;

            left: 6.2%;
            top: 12%;

            display: flex;
            flex-direction: column;
            align-items: flex-start;

            gap: 5px;

            z-index: 90;

            opacity: 0;
            pointer-events: none;

            will-change: opacity;
        }


        .navigation a {
            display: block;
            line-height: 0;
        }


        /*
           Wichtig:

           Alle Bilder haben dieselbe HÖHE.
           Dadurch haben WORK, TEACHING,
           ABOUT und CONTACT dieselbe Schriftgröße.
        */

        .navigation img {
            height: 28px;
            width: auto;
            display: block;
        }


        /* =========================================
           INSTAGRAM
        ========================================= */

        .instagram {
            position: fixed;

            right: 5.8%;
            top: 6%;

            z-index: 90;

            opacity: 0;
            pointer-events: none;

            will-change: opacity;
        }


        .instagram img {
            width: 60px;
            height: auto;

            display: block;
        }


        /* =========================================
           INHALT
        ========================================= */

        .content {
            min-height: 200vh;
        }


        /* =========================================
           HANDY
        ========================================= */

        @media (max-width: 700px) {

            #logo {
                width: 80%;
            }


            .navigation {
                left: 5%;
                top: 12%;
            }


            .navigation img {
                height: 22px;
            }


            .instagram {
                right: 5%;
                top: 5%;
            }


            .instagram img {
                width: 42px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================
         LOGO
    ========================================= -->

    <img
        id="logo"
        src="images/logo_name.png"
        alt="Natascha Burk"
    >



    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <nav class="navigation">

        <a href="#work">
            <img
                src="images/work.png"
                alt="Work"
            >
        </a>


        <a href="#teaching">
            <img
                src="images/teaching.png"
                alt="Teaching"
            >
        </a>


        <a href="#about">
            <img
                src="images/about.png"
                alt="About"
            >
        </a>


        <a href="#contact">
            <img
                src="images/contact.png"
                alt="Contact"
            >
        </a>

    </nav>



    <!-- =========================================
         INSTAGRAM
    ========================================= -->

    <a
        class="instagram"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
    >

        <img
            src="images/instagram.png"
            alt="Instagram"
        >

    </a>



    <!-- =========================================
         STARTSEITE
    ========================================= -->

    <section class="intro"></section>



    <!-- =========================================
         SPÄTERER INHALT
    ========================================= -->

    <main class="content">


        <section id="work">

            <!-- WORK Inhalt kommt später hier hin -->

        </section>


        <section id="teaching">

            <!-- TEACHING Inhalt kommt später hier hin -->

        </section>


        <section id="about">

            <!-- ABOUT Inhalt kommt später hier hin -->

        </section>


        <section id="contact">

            <!-- CONTACT Inhalt kommt später hier hin -->

        </section>


    </main>



    <!-- =========================================
         SCROLL ANIMATION
    ========================================= -->

    <script>


        /* Elemente auswählen */

        const logo =
            document.getElementById("logo");

        const navigation =
            document.querySelector(".navigation");

        const instagram =
            document.querySelector(".instagram");



        /* =========================================
           ANIMATION EINSTELLUNGEN
        ========================================= */


        /*
           Wie weit muss gescrollt werden,
           bis die Animation fertig ist?
        */

        const animationDistance = 500;



        /*
           Größe des Logos

           1    = Startgröße
           0.55 = Größe oben
        */

        const startScale = 1;

        const endScale = 0.55;



        /*
           Position des Logos oben
           nach der Animation
        */

        const endTop = 75;



        /* =========================================
           STARTLOGO KORRIGIEREN
        ========================================= */


        /*
           Hier können wir NUR die Position
           des großen Logos korrigieren.

           Diese Korrektur verschwindet automatisch
           während des Scrollens.

           Dadurch bleibt das kleine Logo oben
           an seiner richtigen Position.


           Horizontal:

           -20 = nach links
            20 = nach rechts


           Vertikal:

           -20 = nach oben
            20 = nach unten
        */


        const startOffsetX = 0;

        const startOffsetY = 0;



        /* =========================================
           ANIMATION
        ========================================= */


        function updatePage() {


            const scrollY = window.scrollY;



            /*
               Fortschritt berechnen

               0 = Startseite

               1 = Animation fertig
            */

            let progress =
                scrollY / animationDistance;



            /*
               Wert zwischen 0 und 1 halten
            */

            progress =
                Math.max(
                    0,
                    Math.min(1, progress)
                );



            /* =====================================
               LOGO GRÖSSE
            ===================================== */


            const scale =
                startScale +
                (endScale - startScale)
                * progress;



            /* =====================================
               LOGO VON MITTE NACH OBEN
            ===================================== */


            const startTop =
                window.innerHeight / 2;


            const top =
                startTop +
                (endTop - startTop)
                * progress;



            /* =====================================
               STARTPOSITION KORREKTUR
            ===================================== */


            /*
               Die Korrektur ist am Anfang 100%.

               Beim Scrollen wird sie immer kleiner.

               Am Ende ist sie 0.
            */


            const offsetX =
                startOffsetX *
                (1 - progress);


            const offsetY =
                startOffsetY *
                (1 - progress);



            /* =====================================
               LOGO ANWENDEN
            ===================================== */


            logo.style.top =
                `${top}px`;


            logo.style.transform =

                `translate(-50%, -50%)
                 translate(${offsetX}px, ${offsetY}px)
                 scale(${scale})`;



            /* =====================================
               MENÜ EINBLENDEN
            ===================================== */


            /*
               Navigation erscheint erst etwas,
               nachdem das Logo angefangen hat
               sich zu bewegen.
            */


            const navProgress =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (progress - 0.35) / 0.4
                    )
                );



            navigation.style.opacity =
                navProgress;


            instagram.style.opacity =
                navProgress;



            /* =====================================
               LINKS AKTIVIEREN
            ===================================== */


            if (navProgress > 0) {

                navigation.style.pointerEvents =
                    "auto";

                instagram.style.pointerEvents =
                    "auto";

            }

            else {

                navigation.style.pointerEvents =
                    "none";

                instagram.style.pointerEvents =
                    "none";

            }

        }



        /* =========================================
           SCROLL EVENT
        ========================================= */


        window.addEventListener(
            "scroll",
            updatePage
        );



        /* Falls Browsergröße geändert wird */

        window.addEventListener(
            "resize",
            updatePage
        );



        /* Beim Laden einmal ausführen */

        updatePage();


    </script>


</body>

</html>
