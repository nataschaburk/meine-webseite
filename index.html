<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Webseite</title>
    <style>
        /* Allgemeine Stile */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white; /* Alles weiß */
            color: #333;
            height: 100vh; /* Vollbildhöhe */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Logo in der Mitte */
        .logo {
            height: 100px;
            width: auto;
            border-radius: 12px;
            transition: transform 0.3s ease;
            margin-bottom: 30px;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        /* Text (optional) */
        .logo-text {
            color: #333;
            font-weight: 600;
            font-size: 1.3em;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Logo in der Mitte -->
    <a href="index.html">
        <img src="logo.png" alt="Mein Logo" class="logo">
    </a>
    <p class="logo-text">Meine Webseite</p>

</body>
</html>
