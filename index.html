<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Natascha Burk</title>

    <style>

        /* =========================================
           GRUNDEINSTELLUNGEN
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: white;
            overflow-x: hidden;
        }


        /* =========================================
           STARTBEREICH
        ========================================= */

        .intro {
            width: 100%;
            height: 100vh;
        }


        /* =========================================
           NAMENSLOGO
        ========================================= */

        #logo {
            position: fixed;

            left: 50%;
            top: 50%;

            /*
               Vorher: 52%
               Jetzt etwas kleiner
            */
            width: 44%;

            /*
               Vorher: 820px
            */
            max-width: 700px;

            height: auto;

            transform: translate(-50%, -50%) scale(1);
            transform-origin: center center;

            z-index: 100;

            will-change: transform, top;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        .navigation {
            position: fixed;

            /*
               Position bleibt unverändert
            */
            left: 6.2%;
            top: 12%;

            display: flex;
            flex-direction: column;
            align-items: flex-start;

            /*
               Abstand ebenfalls etwas kleiner,
               damit die Proportionen stimmen
            */
            gap: 4px;

            z-index: 90;

            opacity: 0;
            pointer-events: none;

            will-change: opacity;
        }


        .navigation a {
            display: block;
            line-height: 0;
        }


        .navigation img {

            /*
               Vorher: 28px
               Jetzt: 24px
            */

            height: 24px;

            width: auto;

            display: block;
        }


        /* =========================================
           INSTAGRAM
        ========================================= */

        .instagram {
            position: fixed;

            /*
               Position bleibt unverändert
            */
            right: 5.8%;
            top: 75px;

            transform: translateY(-50%);

            z-index: 90;

            opacity: 0;
            pointer-events: none;

            will-change: opacity;
        }


        .instagram img {

            /*
               Vorher: 42px
               Jetzt: 36px
            */

            width: 36px;

            height: auto;

            display: block;
        }


        /* =========================================
           INHALT
        ========================================= */

        .content {
            min-height: 200vh;
        }


        /* =========================================
           HANDY
        ========================================= */

        @media (max-width: 700px) {

            #logo {

                /*
                   Vorher: 80%
                */

                width: 68%;
            }


            .navigation {
                left: 5%;
                top: 12%;
            }


            .navigation img {

                /*
                   Vorher: 22px
                */

                height: 19px;
            }


            .instagram {
                right: 5%;
            }


            .instagram img {

                /*
                   Vorher: 34px
                */

                width: 29px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAMENSLOGO
    ========================================= -->

    <img
        id="logo"
        src="images/logo_name.png"
        alt="Natascha Burk"
    >



    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <nav class="navigation">


        <a href="#work">

            <img
                src="images/work.png"
                alt="Work"
            >

        </a>


        <a href="#teaching">

            <img
                src="images/teaching.png"
                alt="Teaching"
            >

        </a>


        <a href="#about">

            <img
                src="images/about.png"
                alt="About"
            >

        </a>


        <a href="#contact">

            <img
                src="images/contact.png"
                alt="Contact"
            >

        </a>


    </nav>



    <!-- =========================================
         INSTAGRAM
    ========================================= -->

    <a
        class="instagram"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
    >

        <img
            src="images/instagram.png"
            alt="Instagram"
        >

    </a>



    <!-- =========================================
         STARTSEITE
    ========================================= -->

    <section class="intro"></section>



    <!-- =========================================
         SPÄTERER INHALT
    ========================================= -->

    <main class="content">


        <section id="work">

            <!-- WORK kommt später hier hin -->

        </section>


        <section id="teaching">

            <!-- TEACHING kommt später hier hin -->

        </section>


        <section id="about">

            <!-- ABOUT kommt später hier hin -->

        </section>


        <section id="contact">

            <!-- CONTACT kommt später hier hin -->

        </section>


    </main>



    <!-- =========================================
         SCROLL-ANIMATION
    ========================================= -->

    <script>


        const logo =
            document.getElementById("logo");


        const navigation =
            document.querySelector(".navigation");


        const instagram =
            document.querySelector(".instagram");



        /* =========================================
           ANIMATIONS-EINSTELLUNGEN
        ========================================= */


        /*
           Scroll-Distanz der Animation
        */

        const animationDistance = 500;



        /*
           Startgröße des Logos
        */

        const startScale = 1;



        /*
           Endgröße des Logos

           Das Verhältnis zwischen großem und
           kleinem Logo bleibt gleich.
        */

        const endScale = 0.55;



        /*
           Position des kleinen Logos oben.

           Bleibt unverändert.
        */

        const endTop = 75;



        /* =========================================
           ANIMATION
        ========================================= */

        function updatePage() {


            const scrollY =
                window.scrollY;



            /*
               Fortschritt:

               0 = Start
               1 = Animation fertig
            */

            let progress =
                scrollY / animationDistance;



            progress =
                Math.max(
                    0,
                    Math.min(1, progress)
                );



            /* =====================================
               LOGO-GRÖSSE
            ===================================== */

            const scale =
                startScale +
                (endScale - startScale)
                * progress;



            /* =====================================
               LOGO-POSITION
            ===================================== */

            const startTop =
                window.innerHeight / 2;


            const top =
                startTop +
                (endTop - startTop)
                * progress;



            /* =====================================
               LOGO ANWENDEN
            ===================================== */

            logo.style.top =
                `${top}px`;


            logo.style.transform =
                `translate(-50%, -50%) scale(${scale})`;



            /* =====================================
               NAVIGATION + INSTAGRAM EINBLENDEN
            ===================================== */

            const navProgress =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (progress - 0.35) / 0.4
                    )
                );


            navigation.style.opacity =
                navProgress;


            instagram.style.opacity =
                navProgress;



            /* =====================================
               LINKS AKTIVIEREN
            ===================================== */

            if (navProgress > 0) {

                navigation.style.pointerEvents =
                    "auto";

                instagram.style.pointerEvents =
                    "auto";

            }

            else {

                navigation.style.pointerEvents =
                    "none";

                instagram.style.pointerEvents =
                    "none";

            }

        }



        /* =========================================
           EVENTS
        ========================================= */

        window.addEventListener(
            "scroll",
            updatePage
        );


        window.addEventListener(
            "resize",
            updatePage
        );


        updatePage();


    </script>


</body>

</html>
