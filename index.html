<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Natascha Burk</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: white;
            overflow-x: hidden;
        }


        /* =========================================
           STARTBEREICH
        ========================================= */

        .intro {
            width: 100%;
            height: 100vh;
        }


        /* =========================================
           NAMENSLOGO - DESKTOP
        ========================================= */

        #logo {
            position: fixed;

            left: 50%;
            top: 50%;

            width: 44%;
            max-width: 700px;
            height: auto;

            transform: translate(-50%, -50%);
            transform-origin: center center;

            z-index: 100;

            will-change: transform, top;
        }


        /* =========================================
           NAVIGATION - DESKTOP
        ========================================= */

        .navigation {
            position: fixed;

            left: 6.2%;
            top: 12%;

            display: flex;
            flex-direction: column;
            align-items: flex-start;

            gap: 4px;

            z-index: 90;

            opacity: 0;
            pointer-events: none;

            will-change: opacity;
        }


        .navigation a {
            display: block;
            line-height: 0;
        }


        .navigation img {
            height: 24px;
            width: auto;
            display: block;
        }


        /* =========================================
           INSTAGRAM - DESKTOP
        ========================================= */

        .instagram {
            position: fixed;

            right: 5.8%;
            top: 75px;

            transform: translateY(-50%);

            z-index: 90;

            opacity: 0;
            pointer-events: none;

            will-change: opacity;
        }


        .instagram img {
            width: 36px;
            height: auto;
            display: block;
        }


        /* =========================================
           INHALT
        ========================================= */

        .content {
            min-height: 200vh;
        }


        /* =========================================
           PRIVACY POLICY
        ========================================= */

        .privacy {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            padding-top: 80px;
            padding-bottom: 35px;
        }


        .privacy a {
            display: inline-block;
            line-height: 0;
        }


        .privacy img {
            /*
               Bewusst sehr klein und dezent
            */

            height: 10px;
            width: auto;

            display: block;
        }


        /* =========================================
           MOBILE VERSION
        ========================================= */

        @media (max-width: 700px) {


            /* NAMENSLOGO */

            #logo {
                width: 72%;
                max-width: none;
            }


            /* NAVIGATION */

            .navigation {
                left: 6%;
                top: 92px;

                gap: 0;
            }


            .navigation a {
                display: flex;
                align-items: center;

                min-height: 30px;

                padding-right: 20px;

                line-height: 0;
            }


            .navigation img {
                height: 11px;
                width: auto;
                display: block;
            }


            /* INSTAGRAM */

            .instagram {
                right: 6%;
                top: 55px;
            }


            .instagram img {
                width: 18px;
                height: auto;
            }


            /* PRIVACY POLICY */

            .privacy {
                padding-top: 60px;
                padding-bottom: 25px;
            }


            .privacy img {
                height: 8px;
                width: auto;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAMENSLOGO
    ========================================= -->

    <img
        id="logo"
        src="images/logo_name.png"
        alt="Natascha Burk"
    >


    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <nav class="navigation">

        <a href="#work">
            <img
                src="images/work.png"
                alt="Work"
            >
        </a>

        <a href="#teaching">
            <img
                src="images/teaching.png"
                alt="Teaching"
            >
        </a>

        <a href="#about">
            <img
                src="images/about.png"
                alt="About"
            >
        </a>

        <a href="#contact">
            <img
                src="images/contact.png"
                alt="Contact"
            >
        </a>

    </nav>


    <!-- =========================================
         INSTAGRAM
    ========================================= -->

    <a
        class="instagram"
        href="https://www.instagram.com/natascha_burk/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram von Natascha Burk"
    >

        <img
            src="images/instagram.png"
            alt="Instagram"
        >

    </a>


    <!-- =========================================
         STARTSEITE
    ========================================= -->

    <section class="intro"></section>


    <!-- =========================================
         INHALT
    ========================================= -->

    <main class="content">

        <section id="work">
            <!-- WORK -->
        </section>

        <section id="teaching">
            <!-- TEACHING -->
        </section>

        <section id="about">
            <!-- ABOUT -->
        </section>

        <section id="contact">
            <!-- CONTACT -->
        </section>

    </main>


    <!-- =========================================
         PRIVACY POLICY
    ========================================= -->

    <footer class="privacy">

        <a
            href="#privacy"
            aria-label="Privacy Policy"
        >

            <img
                src="images/privacy_policy.png"
                alt="Privacy Policy"
            >

        </a>

    </footer>


    <!-- =========================================
         SCROLL-ANIMATION
    ========================================= -->

    <script>

        const logo =
            document.getElementById("logo");

        const navigation =
            document.querySelector(".navigation");

        const instagram =
            document.querySelector(".instagram");


        const animationDistance = 500;


        function updatePage() {

            const scrollY =
                window.scrollY;


            const isMobile =
                window.innerWidth <= 700;


            /* LOGO-GRÖSSE */

            const startScale = 1;

            const endScale =
                isMobile ? 0.40 : 0.55;


            /* LOGO-ENDPOSITION */

            const endTop =
                isMobile ? 55 : 75;


            /* FORTSCHRITT */

            let progress =
                scrollY / animationDistance;


            progress =
                Math.max(
                    0,
                    Math.min(1, progress)
                );


            /* LOGO-GRÖSSE */

            const scale =
                startScale +
                (endScale - startScale)
                * progress;


            /* LOGO-POSITION */

            const startTop =
                window.innerHeight / 2;


            const top =
                startTop +
                (endTop - startTop)
                * progress;


            /* LOGO AKTUALISIEREN */

            logo.style.top =
                `${top}px`;


            logo.style.transform =
                `translate(-50%, -50%) scale(${scale})`;


            /* NAVIGATION + INSTAGRAM EINBLENDEN */

            const navProgress =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (progress - 0.35) / 0.4
                    )
                );


            navigation.style.opacity =
                navProgress;


            instagram.style.opacity =
                navProgress;


            /* LINKS AKTIVIEREN */

            if (navProgress > 0) {

                navigation.style.pointerEvents =
                    "auto";

                instagram.style.pointerEvents =
                    "auto";

            }

            else {

                navigation.style.pointerEvents =
                    "none";

                instagram.style.pointerEvents =
                    "none";

            }

        }


        /* =========================================
           EVENTS
        ========================================= */

        window.addEventListener(
            "scroll",
            updatePage,
            { passive: true }
        );


        window.addEventListener(
            "resize",
            updatePage
        );


        updatePage();

    </script>


</body>

</html>
