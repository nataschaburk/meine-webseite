<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Webseite</title>
    <style>
        /* Allgemeine Stile */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: #333;
            height: 200vh; /* Mehr Scroll-Höhe für Test */
        }

        /* Hauptinhalt (großes Logo in der Mitte) */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            position: relative;
        }

        /* Großes Logo (Start) */
        .logo-large {
            height: 300px;
            width: auto;
            border-radius: 12px;
            transition: transform 0.3s ease;
            z-index: 1;
            max-width: 90vw;
            max-height: 90vh;
        }

        .logo-large:hover {
            transform: scale(1.05);
        }

        /* Kleines Logo (fixiert oben) */
        .logo-small {
            height: 50px;
            width: auto;
            border-radius: 10px;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            transition: transform 0.3s ease;
            opacity: 0;
        }
