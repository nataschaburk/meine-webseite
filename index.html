<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Natascha Burk</title>

    <style>

        /* =========================================
           GRUNDEINSTELLUNGEN
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: white;
            overflow-x: hidden;
        }


        /* =========================================
           STARTBEREICH
        ========================================= */

        .intro {
            width: 100%;
            height: 100vh;
        }


        /* =========================================
           NAMENSLOGO - DESKTOP
        ========================================= */

        #logo {
            position: fixed;

            left: 50%;
            top: 50%;

            width: 44%;
            max-width: 700px;
            height: auto;

            transform: translate(-50%, -50%);
            transform-origin: center center;

            z-index: 100;

            will-change: transform, top;
        }


        /* =========================================
           NAVIGATION - DESKTOP
        ========================================= */

        .navigation {
            position: fixed;

            left: 6.2%;
            top: 12%;

            display: flex;
            flex-direction: column;
            align-items: flex-start;

            gap: 4px;

            z-index: 90;

            opacity: 0;
            pointer-events: none;

            will-change: opacity;
        }

        .navigation a {
            display: block;
            line-height: 0;
        }

        .navigation img {
            height: 24px;
            width: auto;
            display: block;
        }


        /* =========================================
           INSTAGRAM - DESKTOP
        ========================================= */

        .instagram {
            position: fixed;

            right: 5.8%;
            top: 75px;

            transform: translateY(-50%);

            z-index: 90;

            opacity: 0;
            pointer-events: none;

            will-change: opacity;
        }

        .instagram img {
            width: 36px;
            height: auto;
            display: block;
        }


        /* =========================================
           INHALT
        ========================================= */

        .content {
            min-height: 200vh;
        }


        /* =========================================
           MOBILE VERSION
           
           WICHTIG:
           Alles hier verändert NUR die
           Handy-Version.
        ========================================= */

        @media (max-width: 700px) {


            /* =====================================
               NAMENSLOGO MOBILE
            ===================================== */

            #logo {
                width: 72%;
                max-width: none;
            }


            /* =====================================
               NAVIGATION MOBILE
            ===================================== */

            .navigation {

                /*
                   Links etwas Abstand zum Rand
                */

                left: 6%;


                /*
                   Der Block beginnt bewusst
                   UNTER dem Namenslogo.
                */

                top: 92px;


                /*
                   Sehr kompakter Abstand
                   zwischen den vier Wörtern.
                */

                gap: 2px;
            }


            .navigation img {

                /*
                   Deutlich kleiner als vorher.

                   Vorher: 12px
                   Jetzt: 9px
                */

                height: 9px;

                width: auto;
            }


            /* =====================================
               INSTAGRAM MOBILE
            ===================================== */

            .instagram {

                right: 6%;


                /*
                   Gleiche vertikale Mittelachse
                   wie das kleine Namenslogo.
                */

                top: 55px;
            }


            .instagram img {

                /*
                   Noch kleiner und feiner.
                */

                width: 18px;

                height: auto;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAMENSLOGO
    ========================================= -->

    <img
        id="logo"
        src="images/logo_name.png"
        alt="Natascha Burk"
    >


    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <nav class="navigation">

        <a href="#work">
            <img
                src="images/work.png"
                alt="Work"
            >
        </a>

        <a href="#teaching">
            <img
                src="images/teaching.png"
                alt="Teaching"
            >
        </a>

        <a href="#about">
            <img
                src="images/about.png"
                alt="About"
            >
        </a>

        <a href="#contact">
            <img
                src="images/contact.png"
                alt="Contact"
            >
        </a>

    </nav>


    <!-- =========================================
         INSTAGRAM
    ========================================= -->

    <a
        class="instagram"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
    >

        <img
            src="images/instagram.png"
            alt="Instagram"
        >

    </a>


    <!-- =========================================
         STARTSEITE
    ========================================= -->

    <section class="intro"></section>


    <!-- =========================================
         SPÄTERER INHALT
    ========================================= -->

    <main class="content">

        <section id="work">
            <!-- WORK -->
        </section>

        <section id="teaching">
            <!-- TEACHING -->
        </section>

        <section id="about">
            <!-- ABOUT -->
        </section>

        <section id="contact">
            <!-- CONTACT -->
        </section>

    </main>


    <!-- =========================================
         SCROLL-ANIMATION
    ========================================= -->

    <script>

        const logo =
            document.getElementById("logo");

        const navigation =
            document.querySelector(".navigation");

        const instagram =
            document.querySelector(".instagram");


        /* =========================================
           SCROLL-DISTANZ
        ========================================= */

        const animationDistance = 500;


        /* =========================================
           ANIMATION
        ========================================= */

        function updatePage() {

            const scrollY =
                window.scrollY;


            /*
               Prüfen, ob Handy oder Desktop
            */

            const isMobile =
                window.innerWidth <= 700;


            /* =====================================
               LOGO-GRÖSSEN
            ===================================== */

            const startScale = 1;


            /*
               Desktop bleibt bei 0.55.

               Mobile wird kleiner,
               damit oben mehr Platz entsteht.
            */

            const endScale =
                isMobile ? 0.40 : 0.55;


            /* =====================================
               LOGO-ENDPOSITION
            ===================================== */

            /*
               Desktop: 75px

               Mobile: 55px
            */

            const endTop =
                isMobile ? 55 : 75;


            /* =====================================
               FORTSCHRITT
            ===================================== */

            let progress =
                scrollY / animationDistance;


            progress =
                Math.max(
                    0,
                    Math.min(1, progress)
                );


            /* =====================================
               LOGO-GRÖSSE BERECHNEN
            ===================================== */

            const scale =
                startScale +
                (endScale - startScale)
                * progress;


            /* =====================================
               LOGO-POSITION BERECHNEN
            ===================================== */

            const startTop =
                window.innerHeight / 2;


            const top =
                startTop +
                (endTop - startTop)
                * progress;


            /* =====================================
               LOGO AKTUALISIEREN
            ===================================== */

            logo.style.top =
                `${top}px`;


            logo.style.transform =
                `translate(-50%, -50%) scale(${scale})`;


            /* =====================================
               NAVIGATION + INSTAGRAM EINBLENDEN
            ===================================== */

            const navProgress =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (progress - 0.35) / 0.4
                    )
                );


            navigation.style.opacity =
                navProgress;


            instagram.style.opacity =
                navProgress;


            /* =====================================
               LINKS AKTIVIEREN
            ===================================== */

            if (navProgress > 0) {

                navigation.style.pointerEvents =
                    "auto";

                instagram.style.pointerEvents =
                    "auto";

            }

            else {

                navigation.style.pointerEvents =
                    "none";

                instagram.style.pointerEvents =
                    "none";

            }

        }


        /* =========================================
           EVENTS
        ========================================= */

        window.addEventListener(
            "scroll",
            updatePage,
            { passive: true }
        );


        window.addEventListener(
            "resize",
            updatePage
        );


        updatePage();

    </script>


</body>

</html>
