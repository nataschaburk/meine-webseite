<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Natascha Burk</title>

    <style>

        /* =========================================
           GRUNDEINSTELLUNGEN
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: white;
            overflow-x: hidden;
        }


        /* =========================================
           STARTBEREICH
        ========================================= */

        .intro {
            width: 100%;
            height: 100vh;
        }


        /* =========================================
           NAMENSLOGO
        ========================================= */

        #logo {
            position: fixed;

            left: 50%;
            top: 50%;

            width: 44%;
            max-width: 700px;
            height: auto;

            transform: translate(-50%, -50%);
            transform-origin: center center;

            z-index: 100;

            will-change: transform, top;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        .navigation {
            position: fixed;

            left: 6.2%;
            top: 12%;

            display: flex;
            flex-direction: column;
            align-items: flex-start;

            gap: 4px;

            z-index: 90;

            opacity: 0;
            pointer-events: none;

            will-change: opacity;
        }


        .navigation a {
            display: block;
            line-height: 0;
        }


        .navigation img {
            height: 24px;
            width: auto;
            display: block;
        }


        /* =========================================
           INSTAGRAM
        ========================================= */

        .instagram {
            position: fixed;

            right: 5.8%;
            top: 75px;

            transform: translateY(-50%);

            z-index: 90;

            opacity: 0;
            pointer-events: none;

            will-change: opacity;
        }


        .instagram img {
            width: 36px;
            height: auto;
            display: block;
        }


        /* =========================================
           INHALT
        ========================================= */

        .content {
            min-height: 200vh;
        }



        /* =========================================
           MOBILE VERSION
        ========================================= */

        @media (max-width: 700px) {


            /* -------------------------------------
               NAMENSLOGO

               Das große Startlogo bleibt gut
               sichtbar. Die kleinere Endgröße
               regeln wir weiter unten per JS.
            ------------------------------------- */

            #logo {
                width: 72%;
                max-width: none;
            }



            /* -------------------------------------
               NAVIGATION

               Deutlich kleiner und kompakter
               als vorher.
            ------------------------------------- */

            .navigation {
                left: 6%;

                /*
                   Fester Wert statt 12%.
                   Dadurch ähnelt die Anordnung
                   stärker der Desktop-Version.
                */

                top: 95px;

                gap: 2px;
            }


            .navigation img {
                height: 12px;
                width: auto;
            }



            /* -------------------------------------
               INSTAGRAM
            ------------------------------------- */

            .instagram {
                right: 6%;

                /*
                   Wird mit dem kleinen Namenslogo
                   ausgerichtet.
                */

                top: 55px;
            }


            .instagram img {
                width: 24px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAMENSLOGO
    ========================================= -->

    <img
        id="logo"
        src="images/logo_name.png"
        alt="Natascha Burk"
    >



    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <nav class="navigation">


        <a href="#work">

            <img
                src="images/work.png"
                alt="Work"
            >

        </a>


        <a href="#teaching">

            <img
                src="images/teaching.png"
                alt="Teaching"
            >

        </a>


        <a href="#about">

            <img
                src="images/about.png"
                alt="About"
            >

        </a>


        <a href="#contact">

            <img
                src="images/contact.png"
                alt="Contact"
            >

        </a>


    </nav>



    <!-- =========================================
         INSTAGRAM
    ========================================= -->

    <a
        class="instagram"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
    >

        <img
            src="images/instagram.png"
            alt="Instagram"
        >

    </a>



    <!-- =========================================
         STARTSEITE
    ========================================= -->

    <section class="intro"></section>



    <!-- =========================================
         SPÄTERER INHALT
    ========================================= -->

    <main class="content">


        <section id="work">
            <!-- WORK -->
        </section>


        <section id="teaching">
            <!-- TEACHING -->
        </section>


        <section id="about">
            <!-- ABOUT -->
        </section>


        <section id="contact">
            <!-- CONTACT -->
        </section>


    </main>



    <!-- =========================================
         SCROLL-ANIMATION
    ========================================= -->

    <script>


        const logo =
            document.getElementById("logo");


        const navigation =
            document.querySelector(".navigation");


        const instagram =
            document.querySelector(".instagram");



        /* =========================================
           ANIMATION
        ========================================= */


        const animationDistance = 500;



        function updatePage() {


            const scrollY =
                window.scrollY;



            /*
               Prüfen, ob wir uns auf
               einem kleinen Bildschirm befinden.
            */

            const isMobile =
                window.innerWidth <= 700;



            /* =====================================
               UNTERSCHIEDLICHE WERTE
               FÜR DESKTOP UND MOBILE
            ===================================== */


            const startScale = 1;


            /*
               Desktop:
               kleines Logo = 55 %

               Mobile:
               kleines Logo = 43 %

               Dadurch wird das Namenslogo
               oben auf dem Handy deutlich feiner.
            */

            const endScale =
                isMobile ? 0.43 : 0.55;



            /*
               Position des kleinen Logos.

               Desktop: 75px
               Mobile:  55px
            */

            const endTop =
                isMobile ? 55 : 75;



            /* =====================================
               FORTSCHRITT
            ===================================== */


            let progress =
                scrollY / animationDistance;


            progress =
                Math.max(
                    0,
                    Math.min(1, progress)
                );



            /* =====================================
               LOGO GRÖSSE
            ===================================== */


            const scale =
                startScale +
                (endScale - startScale)
                * progress;



            /* =====================================
               LOGO POSITION
            ===================================== */


            const startTop =
                window.innerHeight / 2;


            const top =
                startTop +
                (endTop - startTop)
                * progress;



            /* =====================================
               LOGO ANWENDEN
            ===================================== */


            logo.style.top =
                `${top}px`;


            logo.style.transform =
                `translate(-50%, -50%) scale(${scale})`;



            /* =====================================
               NAVIGATION + INSTAGRAM
               EINBLENDEN
            ===================================== */


            const navProgress =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (progress - 0.35) / 0.4
                    )
                );


            navigation.style.opacity =
                navProgress;


            instagram.style.opacity =
                navProgress;



            /* =====================================
               LINKS AKTIVIEREN
            ===================================== */


            if (navProgress > 0) {

                navigation.style.pointerEvents =
                    "auto";

                instagram.style.pointerEvents =
                    "auto";

            }

            else {

                navigation.style.pointerEvents =
                    "none";

                instagram.style.pointerEvents =
                    "none";

            }

        }



        /* =========================================
           EVENTS
        ========================================= */


        window.addEventListener(
            "scroll",
            updatePage,
            { passive: true }
        );


        window.addEventListener(
            "resize",
            updatePage
        );


        updatePage();


    </script>


</body>

</html>
