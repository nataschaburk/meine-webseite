<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Natascha Burk</title>

    <style>

        /* =========================================
           GRUNDEINSTELLUNGEN
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: white;
            overflow-x: hidden;
        }


        /* =========================================
           STARTBEREICH
        ========================================= */

        .intro {
            width: 100%;
            height: 100vh;
        }


        /* =========================================
           LOGO
        ========================================= */

        #logo {
            position: fixed;

            left: 50%;
            top: 50%;

            width: 52%;
            max-width: 820px;
            height: auto;

            transform: translate(-50%, -50%) scale(1);
            transform-origin: center center;

            z-index: 100;

            will-change: transform, top;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        .navigation {
            position: fixed;

            left: 6.2%;
            top: 12%;

            display: flex;
            flex-direction: column;
            align-items: flex-start;

            gap: 5px;

            z-index: 90;

            opacity: 0;
            pointer-events: none;

            will-change: opacity;
        }


        .navigation a {
            display: block;
            line-height: 0;
        }


        /*
           Alle Wörter haben dieselbe Höhe.
           Dadurch bleibt die Schriftgröße
           optisch gleich.
        */

        .navigation img {
            height: 28px;
            width: auto;

            display: block;
        }


        /* =========================================
           INSTAGRAM
        ========================================= */

        .instagram {
            position: fixed;

            right: 5.8%;

            /*
               Gleiche vertikale Mitte
               wie das kleine Namenslogo.
            */

            top: 75px;

            transform: translateY(-50%);

            z-index: 90;

            opacity: 0;
            pointer-events: none;

            will-change: opacity;
        }


        .instagram img {
            width: 42px;
            height: auto;

            display: block;
        }


        /* =========================================
           INHALT
        ========================================= */

        .content {
            min-height: 200vh;
        }


        /* =========================================
           HANDY
        ========================================= */

        @media (max-width: 700px) {

            #logo {
                width: 80%;
            }


            .navigation {
                left: 5%;
                top: 12%;
            }


            .navigation img {
                height: 22px;
            }


            .instagram {
                right: 5%;
            }


            .instagram img {
                width: 34px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAMENSLOGO
    ========================================= -->

    <img
        id="logo"
        src="images/logo_name.png"
        alt="Natascha Burk"
    >



    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <nav class="navigation">


        <a href="#work">

            <img
                src="images/work.png"
                alt="Work"
            >

        </a>


        <a href="#teaching">

            <img
                src="images/teaching.png"
                alt="Teaching"
            >

        </a>


        <a href="#about">

            <img
                src="images/about.png"
                alt="About"
            >

        </a>


        <a href="#contact">

            <img
                src="images/contact.png"
                alt="Contact"
            >

        </a>


    </nav>



    <!-- =========================================
         INSTAGRAM
    ========================================= -->

    <a
        class="instagram"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
    >

        <img
            src="images/instagram.png"
            alt="Instagram"
        >

    </a>



    <!-- =========================================
         STARTSEITE
    ========================================= -->

    <section class="intro"></section>



    <!-- =========================================
         SPÄTERER INHALT
    ========================================= -->

    <main class="content">


        <section id="work">

            <!-- WORK kommt später hier hin -->

        </section>


        <section id="teaching">

            <!-- TEACHING kommt später hier hin -->

        </section>


        <section id="about">

            <!-- ABOUT kommt später hier hin -->

        </section>


        <section id="contact">

            <!-- CONTACT kommt später hier hin -->

        </section>


    </main>



    <!-- =========================================
         SCROLL-ANIMATION
    ========================================= -->

    <script>


        /* Elemente auswählen */

        const logo =
            document.getElementById("logo");

        const navigation =
            document.querySelector(".navigation");

        const instagram =
            document.querySelector(".instagram");



        /* =========================================
           ANIMATIONS-EINSTELLUNGEN
        ========================================= */


        /*
           Wie weit gescrollt werden muss,
           bis die Animation abgeschlossen ist.
        */

        const animationDistance = 500;



        /*
           Größe des Logos

           1    = große Startgröße
           0.55 = kleine Endgröße
        */

        const startScale = 1;

        const endScale = 0.55;



        /*
           Vertikale Endposition.

           Die Mitte des kleinen Namenslogos
           befindet sich bei 75px.
        */

        const endTop = 75;



        /* =========================================
           ANIMATION
        ========================================= */

        function updatePage() {


            const scrollY =
                window.scrollY;



            /*
               Fortschritt berechnen.

               0 = Start
               1 = Animation abgeschlossen
            */

            let progress =
                scrollY / animationDistance;



            /*
               Fortschritt zwischen
               0 und 1 begrenzen.
            */

            progress =
                Math.max(
                    0,
                    Math.min(1, progress)
                );



            /* =====================================
               LOGO-GRÖSSE
            ===================================== */

            const scale =
                startScale +
                (endScale - startScale)
                * progress;



            /* =====================================
               LOGO-POSITION
            ===================================== */

            const startTop =
                window.innerHeight / 2;


            const top =
                startTop +
                (endTop - startTop)
                * progress;



            /* =====================================
               LOGO ANWENDEN
            ===================================== */

            logo.style.top =
                `${top}px`;


            logo.style.transform =
                `translate(-50%, -50%) scale(${scale})`;



            /* =====================================
               MENÜ EINBLENDEN
            ===================================== */

            const navProgress =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (progress - 0.35) / 0.4
                    )
                );



            navigation.style.opacity =
                navProgress;


            instagram.style.opacity =
                navProgress;



            /* =====================================
               LINKS AKTIVIEREN
            ===================================== */

            if (navProgress > 0) {

                navigation.style.pointerEvents =
                    "auto";

                instagram.style.pointerEvents =
                    "auto";

            }

            else {

                navigation.style.pointerEvents =
                    "none";

                instagram.style.pointerEvents =
                    "none";

            }

        }



        /* Bei Scrollbewegung aktualisieren */

        window.addEventListener(
            "scroll",
            updatePage
        );



        /* Bei Änderung der Fenstergröße */

        window.addEventListener(
            "resize",
            updatePage
        );



        /* Beim Laden einmal ausführen */

        updatePage();


    </script>


</body>

</html>
