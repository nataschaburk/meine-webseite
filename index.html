<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Natascha Burk</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: white;
            overflow-x: hidden;
        }

        .intro {
            height: 100vh;
        }

        /* LOGO */

        #logo {
            position: fixed;
            left: 50%;
            top: 50vh;

            width: 52%;
            max-width: 820px;
            height: auto;

            transform: translate(-50%, -50%) scale(1);
            transform-origin: center center;

            z-index: 100;

            will-change: transform, top;
        }

        /* NAVIGATION */

        .navigation {
            position: fixed;
            left: 6.2%;
            top: 12%;

            display: flex;
            flex-direction: column;
            align-items: flex-start;

            gap: 8px;

            z-index: 90;

            opacity: 0;
            pointer-events: none;
        }

        .navigation a {
            display: block;
            line-height: 0;
        }

        .navigation img {
            height: 38px;
            width: auto;
            display: block;
        }

        /* INSTAGRAM */

        .instagram {
            position: fixed;
            right: 5.8%;
            top: 6%;

            z-index: 90;

            opacity: 0;
            pointer-events: none;
        }

        .instagram img {
            width: 60px;
            height: auto;
            display: block;
        }

        /* CONTENT */

        .content {
            min-height: 200vh;
        }

        @media (max-width: 700px) {
            #logo {
                width: 80%;
            }

            .navigation img {
                height: 26px;
            }

            .instagram img {
                width: 42px;
            }
        }
    </style>
</head>

<body>

    <img
        id="logo"
        src="images/logo_name.png"
        alt="Natascha Burk"
    >

    <nav class="navigation">

        <a href="#work">
            <img src="images/work.png" alt="Work">
        </a>

        <a href="#teaching">
            <img src="images/teaching.png" alt="Teaching">
        </a>

        <a href="#about">
            <img src="images/about.png" alt="About">
        </a>

        <a href="#contact">
            <img src="images/contact.png" alt="Contact">
        </a>

    </nav>

    <a
        class="instagram"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
    >
        <img src="images/instagarm.png" alt="Instagram">
    </a>

    <section class="intro"></section>

    <main class="content">

        <section id="work"></section>

        <section id="teaching"></section>

        <section id="about"></section>

        <section id="contact"></section>

    </main>

    <script>
        const logo = document.getElementById("logo");
        const navigation = document.querySelector(".navigation");
        const instagram = document.querySelector(".instagram");

        const animationDistance = 500;

        const startScale = 1;
        const endScale = 0.35;

        const endTop = 75;

        function updatePage() {

            const scrollY = window.scrollY;

            let progress = scrollY / animationDistance;

            progress = Math.max(0, Math.min(1, progress));

            const scale =
                startScale +
                (endScale - startScale) * progress;

            const startTop = window.innerHeight / 2;

            const top =
                startTop +
                (endTop - startTop) * progress;

            logo.style.top = `${top}px`;

            logo.style.transform =
                `translate(-50%, -50%) scale(${scale})`;

            const navProgress = Math.max(
                0,
                Math.min(1, (progress - 0.35) / 0.4)
            );

            navigation.style.opacity = navProgress;
            instagram.style.opacity = navProgress;

            if (navProgress > 0) {
                navigation.style.pointerEvents = "auto";
                instagram.style.pointerEvents = "auto";
            } else {
                navigation.style.pointerEvents = "none";
                instagram.style.pointerEvents = "none";
            }
        }

        window.addEventListener("scroll", updatePage);
        window.addEventListener("resize", updatePage);

        updatePage();
    </script>

</body>

</html>
